services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: zeronote
      POSTGRES_DB: zeronote
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeronote -d zeronote"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      SERVER_PORT: 3001
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://zeronote:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/zeronote
      REALTIME_SECRET: ${REALTIME_SECRET:?Set a random REALTIME_SECRET of at least 32 characters}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
volumes:
  postgres:
