name: ZeroNote validation
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  beta:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zeronote
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: zeronote
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U zeronote" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://zeronote:integration-only-password@localhost:5432/zeronote
      WEB_ORIGIN: http://localhost:3000
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@11.9.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint && pnpm type-check && pnpm test && pnpm build && pnpm test:e2e
      - run: docker build -f Dockerfile.server -t zeronote-server:ci .
      - name: Server starts within the Free memory limit
        run: |
          docker run -d --name zeronote-server-smoke --memory=512m --network host \
            -e DATABASE_URL -e NODE_ENV=test -e BETA_REQUIRED=true -e PORT=3006 \
            -e WEB_ORIGIN=http://localhost:3000 zeronote-server:ci
          trap 'docker rm -f zeronote-server-smoke >/dev/null' EXIT
          if ! curl --fail --retry 15 --retry-delay 2 --retry-connrefused --max-time 5 http://127.0.0.1:3006/v1/health; then
            docker logs zeronote-server-smoke
            exit 1
          fi
      - name: Encrypted backup and restore drill
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          mkdir -p "$RUNNER_TEMP/pg-client"
          for command in pg_dump pg_restore psql; do
            cat > "$RUNNER_TEMP/pg-client/$command" <<'CLIENT'
          #!/usr/bin/env bash
          set -euo pipefail
          client_args=()
          if [[ -n "${PGPASSFILE:-}" ]]; then
            client_args+=(--env PGPASSFILE --volume "$PGPASSFILE:$PGPASSFILE:ro")
          fi
          exec docker run --rm -i --network host "${client_args[@]}" postgres:17 "$(basename "$0")" "$@"
          CLIENT
            chmod +x "$RUNNER_TEMP/pg-client/$command"
          done
          export PATH="$RUNNER_TEMP/pg-client:$PATH"
          age-keygen -o "$RUNNER_TEMP/backup.agekey"
          export AGE_RECIPIENT="$(age-keygen -y "$RUNNER_TEMP/backup.agekey")"
          export BACKUP_DIRECTORY="$RUNNER_TEMP/zeronote-backups"
          node scripts/postgres-client.mjs psql -c "INSERT INTO attachments(id,page_id,workspace_id,name,mime,size,payload_hash,data,created_by) SELECT gen_random_uuid(),p.id,p.workspace_id,'backup-fixture.txt','text/plain',5,encode(sha256(convert_to('bytes','UTF8')),'hex'),convert_to('bytes','UTF8'),(SELECT id FROM devices LIMIT 1) FROM pages p LIMIT 1"
          for iteration in 1 2 3 4 5; do bash scripts/backup.sh; done
          test "$(find "$BACKUP_DIRECTORY" -name 'zeronote-*.age' | wc -l)" -eq 4
          if BACKUP_DIRECTORY="$GITHUB_WORKSPACE/backups" bash scripts/backup.sh; then
            echo 'Backup unexpectedly allowed a repository path.' >&2
            exit 1
          fi
          node scripts/postgres-client.mjs psql -c 'CREATE DATABASE zeronote_restore'
          export RESTORE_DATABASE_URL='postgresql://zeronote:integration-only-password@localhost:5432/zeronote_restore'
          export AGE_IDENTITY_FILE="$RUNNER_TEMP/backup.agekey"
          export BACKUP_FILE="$(find "$BACKUP_DIRECTORY" -name 'zeronote-*.age' -print -quit)"
          bash scripts/restore.sh
          DATABASE_URL="$RESTORE_DATABASE_URL" node scripts/postgres-client.mjs psql -Atc 'SELECT count(*) FROM schema_migrations' | grep -Ex '4'
          node scripts/postgres-client.mjs psql -Atc 'SELECT EXISTS(SELECT 1 FROM pages) AND EXISTS(SELECT 1 FROM document_checkpoints)' | grep -Ex 't'
          DATABASE_URL="$RESTORE_DATABASE_URL" node scripts/postgres-client.mjs psql -Atc 'SELECT count(*) FROM attachments' | grep -Ex '1'
          for table in workspaces pages document_checkpoints document_operations document_snapshots memberships grants comments beta_codes beta_devices attachments attachment_operations; do
            query="SELECT count(*)::text || ':' || md5(COALESCE(jsonb_agg(to_jsonb(data) ORDER BY to_jsonb(data)::text)::text, '[]')) FROM $table data"
            source_fingerprint="$(node scripts/postgres-client.mjs psql -Atqc "$query")"
            restored_fingerprint="$(DATABASE_URL="$RESTORE_DATABASE_URL" node scripts/postgres-client.mjs psql -Atqc "$query")"
            if [[ "$source_fingerprint" != "$restored_fingerprint" ]]; then
              printf 'Restored data does not match table %s.\n' "$table" >&2
              exit 1
            fi
          done
          if bash scripts/restore.sh; then
            echo 'Restore unexpectedly allowed a non-empty database.' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results
