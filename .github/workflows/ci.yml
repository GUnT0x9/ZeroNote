name: ZeroNote validation
on: [push, pull_request]
jobs:
  alpha:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zeronote
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: zeronote
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U zeronote" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://zeronote:integration-only-password@localhost:5432/zeronote
      WEB_ORIGIN: http://localhost:3000
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@11.9.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint && pnpm type-check && pnpm test && pnpm build && pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results
